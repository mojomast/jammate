<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Guitar Companion">
  <!--
    The 16 and 24 px entries of the .ico.

    A .ico carries a different drawing per size, and this is what that is for:
    the full icon's four bars are 88/512 units wide, which is under three
    pixels at 16 px, and the gaps between them close up. Three fatter pills
    keep the same gesture and stay separated.
  -->
  <defs>
    <linearGradient id="gcPulseSmall" x1="52" y1="36" x2="460" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#57becb"/>
      <stop offset="1" stop-color="#46a9b5"/>
    </linearGradient>
  </defs>
  <g fill="url(#gcPulseSmall)">
    <rect x="52"  y="156" width="112" height="200" rx="56"/>
    <rect x="200" y="36"  width="112" height="440" rx="56"/>
    <rect x="348" y="106" width="112" height="300" rx="56"/>
  </g>
</svg>
