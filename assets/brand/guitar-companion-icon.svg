<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Guitar Companion">
  <!--
    Guitar Companion app icon - "Pulse".

    Sound on its own: four pill beats, no instrument depicted. The mark spans
    x 32..480 and y 26..486, so it fills ~88% of the frame in both directions -
    an app icon that floats in the middle of its square throws away legibility
    at every size.

    Palette is the app's own (src/LookAndFeel.h): accent #57becb ->
    accentDark #46a9b5. No amber here on purpose; the accent stays reserved.

    See guitar-companion-icon-small.svg for the drawing used at 16 and 24 px,
    where four bars of 88/512 units collapse into each other.
  -->
  <defs>
    <!-- One ramp across the whole mark, in user space. The source design let
         each bar resolve the gradient against its own bounding box, which
         gives every bar the full ramp; at this colour range the two are
         indistinguishable, and a single ramp stays coherent if the bars
         ever change. -->
    <linearGradient id="gcPulse" x1="32" y1="26" x2="480" y2="486" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#57becb"/>
      <stop offset="1" stop-color="#46a9b5"/>
    </linearGradient>
  </defs>
  <g fill="url(#gcPulse)">
    <rect x="32"  y="166" width="88" height="180" rx="44"/>
    <rect x="152" y="91"  width="88" height="330" rx="44"/>
    <rect x="272" y="26"  width="88" height="460" rx="44"/>
    <rect x="392" y="126" width="88" height="260" rx="44"/>
  </g>
</svg>
